name: GitHub Pages Canlı Yayını

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
      - name: GitHub Pages Yapılandır
        uses: actions/configure-pages@v5
      - name: Statik Dosyaları Paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: GitHub Pages'e Dağıt
        id: deployment
        uses: actions/deploy-pages@v4
